<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Deck</title>
<!--
  ================================================================
  Motion Deck 引擎（只有基礎建設，沒有任何設計）
  ----------------------------------------------------------------
  這個檔案只負責「簡報要能用」的部分：
    16:9 舞台縮放、翻頁輸入（鍵盤／點擊／滑動／滾輪）、網址 #n、
    轉場鎖與排隊、GSAP 失效降級、prefers-reduced-motion、頁碼進度。
  視覺與動態全部由你設計——字體、色彩、版面、轉場、進場、細微動態都從零開始。
  HUD（進度條／頁碼）也可以重新設計或整個刪掉。

  API
  · <section class="slide" id="s-xxx" data-transition="名稱">
      data-transition = 進入這一頁時用的轉場；往回翻時用「離開頁」的轉場，dir = -1
  · Deck.transition(name, (tl, from, to, dir) => {})
      在 tl 上編排換頁。可用 tl.addLabel("enter", t) 指定新頁內容開始進場的時間點，
      未指定時為轉場長度的一半。
  · Deck.scene(id, { enter(tl, el, dir, at) {}, idle(el) {} })
      enter：該頁內容的進場編排（at = enter 標籤時間）
      idle ：靜止時的細微動態（GSAP），離開時自動 revert
  · Deck.onCleanup(fn)：轉場結束時執行（例如 SplitText 的 revert）
  · Deck.go(i) / next() / prev() / index / total

  鐵則：HTML/CSS 預設狀態 = 靜止完整狀態。
  轉場結束時，timeline 動過的每個元素都會 clearProps 回到 CSS 狀態——
  所以 CSS 寫的就是讀者最後看到的畫面，動畫只是「抵達」那裡的過程。
  （因此會被動畫的元素，靜止樣式要寫在 <style> 裡，不要寫 inline style，否則會被清掉。）
  ================================================================
-->
<style>
  :root {
    --bg: #111;
    --ink: #eee;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }

  /* 舞台：1920×1080 設計座標，JS 等比縮放 */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%);
    overflow: hidden;
    background: var(--bg);
  }
  .js:not(.ready) .stage { visibility: hidden; }

  .slide { position: absolute; inset: 0; visibility: hidden; }
  .slide.is-active { visibility: visible; }
  html:not(.js) .slide:first-of-type { visibility: visible; } /* JS 全失效時至少顯示第一頁 */

  /* HUD：可重新設計或刪除 */
  .hud { position: fixed; inset: auto 0 0 0; height: 40px; pointer-events: none; z-index: 20;
         font: 12px/40px system-ui, sans-serif; color: var(--ink); opacity: .5; }
  .hud .bar { position: absolute; inset: auto 0 0 0; height: 2px; }
  .hud .bar i { position: absolute; inset: 0; background: currentColor; transform-origin: 0 50%;
                transform: scaleX(0); transition: transform .8s cubic-bezier(.16,1,.3,1); }
  .hud .count { position: absolute; right: 20px; bottom: 4px; font-variant-numeric: tabular-nums; }

  /* 轉場中暫停 CSS 細微動態 */
  .is-transitioning .slide, .is-transitioning .slide * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) {
    .slide, .slide * { animation: none !important; }
    .hud .bar i { transition: none; }
  }

  /* ================= 作品樣式 ================= */
</style>
</head>
<body>

<div class="stage" id="stage">
  <section class="slide" id="s-1" data-transition="fade">
    <!-- 作品內容 -->
  </section>
</div>

<div class="hud" aria-hidden="true"><div class="bar"><i></i></div><div class="count"></div></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<!-- 需要時再加：SplitText / Flip / MorphSVGPlugin / DrawSVGPlugin / CustomEase …（同版本路徑） -->

<!-- ================= 引擎（一般不需修改） ================= -->
<script>
(() => {
  const W = 1920, H = 1080;
  const root = document.documentElement;
  const stage = document.getElementById("stage");
  const slides = [...stage.querySelectorAll(".slide")];
  const bar = document.querySelector(".hud .bar i");
  const counter = document.querySelector(".hud .count");
  const G = window.gsap;
  const mq = matchMedia("(prefers-reduced-motion: reduce)");
  let reduced = mq.matches;
  mq.addEventListener?.("change", e => (reduced = e.matches));

  if (G) {
    const plugins = ["SplitText", "Flip", "MorphSVGPlugin", "DrawSVGPlugin", "CustomEase", "MotionPathPlugin"]
      .map(n => window[n]).filter(Boolean);
    if (plugins.length) G.registerPlugin(...plugins);
  }
  root.classList.add("js");

  let index = 0, busy = false, pending = null, idleCtx = null, cleanups = [];
  const scenes = {};
  const clamp = i => Math.max(0, Math.min(slides.length - 1, i));
  const pad = n => String(n).padStart(2, "0");

  const fit = () => {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  addEventListener("resize", fit); fit();

  /* 轉場：只內建 fade（reduced-motion 與未指定時使用），其餘由作品註冊 */
  const T = {
    fade(tl, from, to) {
      tl.fromTo(to, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "sine.inOut" }, 0)
        .to(from, { autoAlpha: 0, duration: 0.4, ease: "sine.inOut" }, 0)
        .addLabel("enter", 0.15);
    },
  };

  function startIdle(slide) {
    if (!G || reduced || !scenes[slide.id]?.idle) return;
    idleCtx = G.context(() => scenes[slide.id].idle(slide));
  }
  function stopIdle() { idleCtx?.revert(); idleCtx = null; }

  // 轉場結束：把 timeline 動過的元素還原成 CSS 狀態，保證靜止畫面完整
  function settle(tl, to, from) {
    if (from) from.classList.remove("is-active");
    cleanups.splice(0).forEach(f => f());
    if (G) {
      const touched = new Set([to, from].filter(Boolean));
      tl?.getChildren(true, true, false).forEach(t =>
        t.targets().forEach(el => el instanceof Element && el.isConnected && touched.add(el)));
      G.set([...touched], { clearProps: "all" });
    }
    root.classList.remove("is-transitioning");
    busy = false;
    startIdle(to);
    if (pending !== null) { const p = pending; pending = null; go(p); }
  }

  function updateHud() {
    if (bar) bar.style.transform = `scaleX(${(index + 1) / slides.length})`;
    if (counter) counter.textContent = `${pad(index + 1)} / ${pad(slides.length)}`;
    history.replaceState(null, "", `#${index + 1}`);
  }

  function go(target, dir) {
    target = clamp(target);
    if (target === index) return;
    if (busy) { pending = target; return; }
    dir = dir ?? (target > index ? 1 : -1);
    const from = slides[index], to = slides[target];
    busy = true;
    root.classList.add("is-transitioning");
    stopIdle();
    index = target;
    updateHud();
    to.classList.add("is-active");

    if (!G) { // CDN 失效：Web Animations 淡入
      to.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: "ease-out" })
        .finished.then(() => settle(null, to, from));
      return;
    }
    G.set(from, { zIndex: 1 }); G.set(to, { zIndex: 2 });
    const tl = G.timeline({ onComplete: () => settle(tl, to, from) });
    if (reduced) { T.fade(tl, from, to, dir); return; }
    const name = (dir > 0 ? to : from).dataset.transition;
    (T[name] || T.fade)(tl, from, to, dir);
    const at = tl.labels.enter ?? tl.duration() * 0.5;
    scenes[to.id]?.enter?.(tl, to, dir, at);
  }

  function intro() {
    const s = slides[index];
    s.classList.add("is-active");
    updateHud();
    root.classList.add("ready");
    if (!G || reduced) return startIdle(s);
    busy = true;
    root.classList.add("is-transitioning");
    const tl = G.timeline({ onComplete: () => settle(tl, s) });
    if (scenes.intro) scenes.intro(tl, s);          // 開場：可註冊 Deck.scene("intro", fn)
    else tl.from(s, { autoAlpha: 0, duration: 0.5 }, 0);
    scenes[s.id]?.enter?.(tl, s, 1, 0.2);
  }

  /* 輸入 */
  const next = () => go(index + 1, 1), prev = () => go(index - 1, -1);
  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "Home") go(0);
    else if (k === "End") go(slides.length - 1);
    else if (k === "f" || k === "F") document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen?.();
  });
  let tx = 0, ty = 0, swipedAt = 0;
  addEventListener("click", e => {
    if (e.target.closest("a, button, input, textarea, select, [data-no-nav]")) return;
    if (performance.now() - swipedAt < 600) return;
    e.clientX < innerWidth * 0.3 ? prev() : next();
  });
  let wheelAcc = 0, wheelLock = 0;
  addEventListener("wheel", e => {
    const now = performance.now();
    if (now < wheelLock) return;
    wheelAcc += e.deltaY + e.deltaX;
    if (Math.abs(wheelAcc) > 60) { wheelAcc > 0 ? next() : prev(); wheelAcc = 0; wheelLock = now + 900; }
  }, { passive: true });
  addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 50) return;
    swipedAt = performance.now();
    (Math.abs(dx) > Math.abs(dy) ? dx : dy) < 0 ? next() : prev();
  }, { passive: true });
  addEventListener("hashchange", () => go(parseInt(location.hash.slice(1), 10) - 1 || 0));

  window.Deck = {
    go, next, prev,
    get index() { return index; },
    get total() { return slides.length; },
    get busy() { return busy; },
    get reduced() { return reduced; },
    transition: (name, fn) => (T[name] = fn),
    scene: (id, def) => (scenes[id] = def),
    onCleanup: fn => cleanups.push(fn),
  };

  /* 啟動：等字體（SplitText 斷行需要）與作品 script 註冊完畢 */
  const fromHash = parseInt(location.hash.slice(1), 10);
  if (fromHash) index = clamp(fromHash - 1);
  const loaded = new Promise(r => (document.readyState === "complete" ? r() : addEventListener("load", r)));
  const timeout = new Promise(r => setTimeout(r, 3000));
  Promise.race([Promise.all([document.fonts?.ready, loaded]), timeout]).then(intro);
})();
</script>

<!-- ================= 作品：轉場、場景、細微動態 ================= -->
<script>
</script>
</body>
</html>
